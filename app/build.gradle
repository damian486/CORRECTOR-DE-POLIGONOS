plugins {
    id 'com.android.application'
}

android {
    namespace 'org.wellkind.corrector'
    compileSdk 34

    defaultConfig {
        applicationId 'org.wellkind.corrector'
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName '1.13'
    }

    // Llave fija: cada APK nuevo se instala encima del anterior
    signingConfigs {
        fija {
            storeFile file('llave.keystore')
            storePassword 'android'
            keyAlias 'llave'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fija
        }
        debug {
            signingConfig signingConfigs.fija
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
